apiVersion: 1
# Prometheus only: Grafana's Jaeger data source still calls Jaeger's v1 query API, which Jaeger 2.21 no longer
# serves, so the dashboard links to the Jaeger UI instead.
datasources:
  - name: Prometheus
    uid: hashspan-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
