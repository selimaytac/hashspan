# Local lab: Jaeger (trace UI + OTLP receiver). Anvil runs as a project-local binary (make anvil).
# The `metrics` profile adds Prometheus (OTLP metrics receiver) and Grafana with dashboards/metrics.json.
# Images are pinned by digest; Dependabot updates tag and digest together. All ports bind to 127.0.0.1 only.
# Managed via the Makefile (make lab-up / lab-metrics / lab-pause / lab-nuke).
# Before 1.1 the project was named hashspan-lab: make lab-nuke removes its containers and volumes too, and
# `docker compose -f docker/compose.yaml -p hashspan-lab --profile metrics down -v` removes only those.
name: hashspan-dev

services:
  jaeger:
    image: jaegertracing/jaeger:2.21.0@sha256:3d0ac795ff98aa04d1be04311d2dac6c25b4bfc8322dc02e53bc5b170c5018c3
    ports:
      - "127.0.0.1:16686:16686" # UI
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP
    deploy:
      resources:
        limits: { memory: 512m }

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [metrics]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver # OTLP metrics on /api/v1/otlp/v1/metrics
      # A zero sample at each series' start time, so increase() and rate() work for a short-lived process that
      # exports once, such as the example agent.
      - --enable-feature=created-timestamp-zero-ingestion
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits: { memory: 256m }

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: [metrics]
    environment:
      # Local only: anonymous viewers see the provisioned dashboard; nothing is reported to Grafana Labs.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/metrics.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # metrics.json only: traces.json needs Tempo, which this stack does not run.
      - ../dashboards/metrics.json:/var/lib/grafana/dashboards/metrics.json:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    deploy:
      resources:
        limits: { memory: 512m } # Grafana 13 is killed at 256m while it renders the dashboard
