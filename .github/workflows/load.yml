name: Load

# Load and long-run checks of background confirmation on Anvil (`pnpm test:load`): hundreds of confirmations polling at
# once, the background confirmation limit, timers left after flush() and heap growth across batches. They take longer
# than the other suites, so they run weekly and by hand rather than on every pull request. The job also runs on a pull
# request that changes it or the load tests.
on:
  schedule:
    - cron: '7 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/load.yml
      - 'packages/*/test/**/*.load.test.ts'

permissions: {}

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    name: Load and long-run checks (Anvil)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/install-anvil.sh
      - run: pnpm test:load
