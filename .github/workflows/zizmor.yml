name: Workflow audit

# zizmor checks the GitHub Actions workflows for injection, excessive permissions, credential persistence and
# unpinned actions (ADR 0025). Findings go to code scanning. It runs on every pull request, so that `main` can require
# it: a required check that a path filter skips would leave a pull request waiting.
on:
  pull_request:
  push:
    branches: [main]
    paths: ['.github/workflows/**', '.github/actions/**']
  workflow_dispatch:

permissions: {}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.30.1
