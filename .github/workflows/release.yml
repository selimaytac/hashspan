name: Release

# Manual trigger. With pending changesets, a run opens or updates the "Version packages" pull request; after that pull
# request is merged, the next run publishes to npm once a maintainer approves the npm environment. Packages are
# published with Trusted Publishing (OIDC): no npm token is stored anywhere. See docs/releasing.md.
on:
  workflow_dispatch:

permissions: {}

concurrency: release

jobs:
  ci:
    name: Checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  mode:
    name: Select mode
    needs: ci
    # Releases come from main only; the npm environment enforces it for publishing on GitHub's side as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No dependency cache in the release jobs: other jobs on main save it, and they run code resolved fresh
          # from the registry. Every release job installs from the lockfile instead.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version packages
    needs: mode
    if: needs.mode.outputs.mode == 'version'
    runs-on: ubuntu-latest
    # Installs the dependencies and runs changesets, so it gets a read-only token; the next job pushes the result.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Bump versions and write the changelogs
        env:
          # Read by @changesets/changelog-github to link pull requests and authors.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm version-packages
      - name: Write the version bump as a patch
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo 'pnpm version-packages changed nothing' >&2
            exit 1
          fi
          git diff --cached --binary > "$RUNNER_TEMP/version-packages.patch"
          git diff --cached --stat
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: version-packages
          path: ${{ runner.temp }}/version-packages.patch
          if-no-files-found: error
          retention-days: 1

  push-version:
    name: Version packages branch
    needs: version
    runs-on: ubuntu-latest
    # Pushes the version bump to the changeset-release branch; a maintainer opens the pull request from it, so CI runs
    # on it. GitHub Actions may not open pull requests in this repository, which changesets/action requires. The job
    # installs nothing and runs git only, so no dependency code runs with the write token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token is used by the push step only, not kept in the git config.
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-packages
          path: ${{ runner.temp }}/version-packages
      - name: Commit and push the changeset-release branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: changeset-release/main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git switch --create "$BRANCH"
          git apply --index "$RUNNER_TEMP/version-packages/version-packages.patch"
          git commit --message 'Version Packages'
          # The branch only ever holds the latest version bump, so an earlier one is replaced.
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/$BRANCH"
          {
            echo '### Version packages branch pushed'
            echo
            echo "Open the pull request: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "or run \`gh pr create --base main --head ${BRANCH} --title \"Version Packages\"\`."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm
    needs: mode
    if: needs.mode.outputs.mode == 'publish'
    # Deployment branches: main, and a required reviewer. npm only trusts publishes from this environment, and this
    # is the only job that can mint the OIDC token (id-token: write).
    environment: npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      packages: ${{ steps.publish.outputs.published-packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] changesets pushes the release tags with these credentials
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
          # No registry-url: setup-node would write an .npmrc with an empty token, which gets in the way of OIDC.
      - run: pnpm install --frozen-lockfile
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: pnpm release
          create-github-releases: true

  check:
    name: Install the published packages
    needs: publish
    if: needs.publish.outputs.published == 'true'
    # Installing from the registry and importing runs the code of every dependency, peer dependencies included, so it
    # runs here, with read-only permissions and outside the npm environment, not in the job that can publish.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install and import each published version
        env:
          PUBLISHED_PACKAGES: ${{ needs.publish.outputs.packages }}
        run: node scripts/check-published.mjs
