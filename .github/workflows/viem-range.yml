name: viem range

# CI tests the viem adapter against the viem of the lockfile; this job tests both ends of its peer range, so that a
# change shows up before users report it: the newest release, with typecheck and every viem test, and the oldest
# version the range allows, with the unit and integration tests (types of an old release are not checked). A test that
# needs an action or a behaviour of a newer viem than the floor is gated through packages/viem/test/viem-version.ts,
# with the release that introduced it. Tests run offline, as in CI. The updated lockfile is not committed. The job
# also runs on a pull request that changes it.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/viem-range.yml

permissions: {}

concurrency:
  group: viem-range-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viem:
    name: viem adapter against the ${{ matrix.end }} viem in range
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        end: [newest, oldest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No pnpm cache: this job installs other viem releases than the lockfile, and a store it saved would be
          # restored under the same key by the release workflow.
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/install-anvil.sh
      # Alto and the EntryPoint artifacts for the real-bundler test, pinned by scripts/bundler/package-lock.json.
      - run: ./scripts/install-bundler.sh
      # Within the ranges in package.json (^2), so a new major is a deliberate change rather than a failing job. In every
      # workspace package, so that the typecheck sees one viem: the other packages pass viem values to the adapter.
      - name: Update viem to the newest release in range
        if: matrix.end == 'newest'
        run: pnpm --recursive update viem
      - name: Install the oldest viem of the peer range
        if: matrix.end == 'oldest'
        run: | # zizmor: ignore[adhoc-packages] installs the floor of the peer range on purpose; not committed
          floor=$(node -p "require('./packages/viem/package.json').peerDependencies.viem.replace(/^\^/, '')")
          pnpm --filter @hashspan/viem add -D "viem@$floor"
      - run: pnpm --filter @hashspan/viem list viem --depth 0
      - name: Typecheck
        if: matrix.end == 'newest'
        run: pnpm typecheck
      - name: Unit and integration tests of the viem adapter
        run: pnpm vitest run packages/viem
