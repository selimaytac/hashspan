name: Dashboards

# Runs every PromQL query of dashboards/*.json against the local lab's Prometheus after `make demo` (`make lab-check`).
# It pulls the lab's images and runs the example agent, so it runs on changes to the dashboards, the lab, the
# conventions or the instrumentation, weekly and by hand, and not in the CI workflow that a release runs.
on:
  pull_request:
    paths:
      - .github/workflows/dashboards.yml
      - 'dashboards/**'
      - 'docker/**'
      - scripts/check-dashboards.mjs
      - docs/semconv.md
      - 'packages/*/src/**'
  push:
    branches: [main]
    paths:
      - .github/workflows/dashboards.yml
      - 'dashboards/**'
      - 'docker/**'
      - scripts/check-dashboards.mjs
      - docs/semconv.md
      - 'packages/*/src/**'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: dashboards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboards:
    name: Dashboard queries (Prometheus)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Jaeger, Prometheus and Grafana
        run: make lab-metrics
      - name: Wait for Prometheus
        run: timeout 60 sh -c 'until curl -sf http://127.0.0.1:9090/-/ready; do sleep 1; done'
      # make demo sends the example agent's metrics to Prometheus when it is ready.
      - run: make demo
      - name: Run every PromQL query of dashboards/*.json
        run: make lab-check
