name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Called by the release workflow, so a release runs exactly these checks first.
  workflow_call:

permissions:
  contents: read

concurrency:
  # The workflow name keeps a run called by the release apart from push and pull request runs.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check package contents and type resolution
        run: pnpm check:packages

  integration:
    name: Integration tests (Anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/install-anvil.sh
      # Alto and the EntryPoint artifacts for the real-bundler test, pinned by scripts/bundler/package-lock.json.
      - run: ./scripts/install-bundler.sh
      # Report only: Alto's tree runs in this test job alone and never ships; its advisories are listed for review.
      - name: Report advisories of the test bundler's dependencies
        continue-on-error: true
        run: npm audit --prefix scripts/bundler
      - name: Unit and integration tests with coverage thresholds
        run: pnpm test:coverage

  smoke-versions:
    name: Node.js versions to smoke-test
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The lowest version is read from `engines.node` of the packages, so it cannot drift from what they declare.
      - id: versions
        run: echo "matrix=$(node scripts/smoke-packages.mjs --matrix)" >> "$GITHUB_OUTPUT"

  smoke:
    name: Smoke test of the packages (Node.js ${{ matrix.node }})
    needs: smoke-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.smoke-versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # Build, pack and install with the development version; only the checks run on the version under test.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack the packages and install them with their peer dependencies
        run: node scripts/smoke-packages.mjs --prepare-only --dir "$RUNNER_TEMP/smoke"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: require() and import the packages and trace with them
        run: node scripts/smoke-packages.mjs --check-only --dir "$RUNNER_TEMP/smoke"

  dependencies:
    name: Dependency audit and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every dependency in the lockfile, dev dependencies included. Only high and critical advisories fail; one
      # that does not apply can be ignored by its GHSA id in `pnpm.auditConfig.ignoreGhsas` in package.json.
      - name: Audit
        run: pnpm audit --audit-level high
      - name: Check licenses
        run: node scripts/check-licenses.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Pinned by digest, like the actions by commit SHA: a tag can be moved.
      - name: gitleaks
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --verbose
