name: mppx SDK range

# The MPP adapter relies on behaviour of mppx that is not a documented contract: its client events, their payload
# shapes, the credential and receipt encodings and the attribution memo (ADR 0029). mppx is 0.x and breaks in minor
# lines, so the peer range is one minor line (~0.13.5). CI tests mppx from the lockfile; this job tests both ends of the
# range, so that a change shows up before users report it: the newest release in range, with every MPP test, and the
# oldest version the range allows, with the adapter's own tests. Tests run against Anvil in Tempo mode, never a public
# network. The updated lockfile is not committed.
on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mppx-sdk
  cancel-in-progress: true

jobs:
  mppx:
    name: MPP adapter against the ${{ matrix.end }} mppx in range
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        end: [newest, oldest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No pnpm cache: this job installs newer packages than the lockfile, and a store it saved would be restored
          # under the same key by the release workflow.
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/install-anvil.sh
      # Within the range in package.json (~0.13.5), so a new minor line is a deliberate change rather than a failing job.
      - name: Update mppx to the newest release in range
        if: matrix.end == 'newest'
        run: pnpm --filter @hashspan/mpp update mppx
      - name: Install the oldest mppx of the peer range
        if: matrix.end == 'oldest'
        run: | # zizmor: ignore[adhoc-packages] installs the floor of the peer range on purpose; not committed
          floor=$(node -p "require('./packages/mpp/package.json').peerDependencies.mppx.replace(/^[~^]/, '')")
          pnpm --filter @hashspan/mpp add -D "mppx@$floor"
      - run: pnpm --filter @hashspan/mpp list mppx --depth 0
      - name: Typecheck and all MPP tests
        if: matrix.end == 'newest'
        run: |
          pnpm typecheck
          pnpm vitest run packages/mpp
      - name: The adapter's own MPP tests
        if: matrix.end == 'oldest'
        run: pnpm vitest run packages/mpp
