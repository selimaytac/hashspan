name: Integrations

# Runs the setups of docs/integrations.md with the third-party libraries they name, against Anvil and offline.
# integrations/ is a workspace of its own with its own lockfile, so these libraries stay out of the main install and
# of the dependency checks of the published packages. Pull requests test the versions in that lockfile; the weekly
# run updates every dependency of integrations/ to the newest release within its range, so that a change in a
# library shows up before users report it. The updated lockfile is not committed.
on:
  pull_request:
    paths:
      - 'packages/**'
      - 'integrations/**'
      # The tests compile and run hashspan's sources with the main install.
      - 'pnpm-lock.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/integrations.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integrations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrations:
    name: Third-party integrations (Anvil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            integrations/pnpm-lock.yaml
      # The tests import hashspan from its sources, whose dependencies come from the main install.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir integrations install --frozen-lockfile
      # Within the ranges in integrations/package.json, so a new major is a deliberate change rather than a failing job.
      - name: Update the integrations' dependencies within their ranges
        if: github.event_name != 'pull_request'
        run: |
          pnpm --dir integrations update
          pnpm --dir integrations list --depth 0
      - run: ./scripts/install-anvil.sh
      - run: pnpm test:integrations
