version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    # Waits a week before proposing a new release, so a compromised one is likely pulled first.
    cooldown: { default-days: 7 }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    # At least minimumReleaseAge in pnpm-workspace.yaml (a day), which rejects younger versions; a week, so a
    # compromised release is likely pulled before it is proposed.
    cooldown: { default-days: 7 }
    # Raise a range only when a new version falls outside it: a peer dependency range is a published contract, and
    # raising its floor narrows what users may install.
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
  # The local lab's images (docker/compose.yaml), pinned by digest.
  - package-ecosystem: docker-compose
    directory: /docker
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
  # The bundler the integration tests start (scripts/bundler), CI only and installed with --ignore-scripts.
  - package-ecosystem: npm
    directory: /scripts/bundler
    schedule: { interval: monthly }
    cooldown: { default-days: 7 }
  # integrations/ (a workspace of its own, never published) has no entry: .github/workflows/integrations.yml updates
  # every dependency there to the newest release within its range each week and runs the tests, so version update
  # pull requests would duplicate that.
