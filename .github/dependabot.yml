version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    # Matches minimumReleaseAge in pnpm-workspace.yaml, which rejects versions younger than a day.
    cooldown: { default-days: 1 }
    # Raise a range only when a new version falls outside it: a peer dependency range is a published contract, and
    # raising its floor narrows what users may install.
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
  # integrations/ (a workspace of its own, never published) has no entry: .github/workflows/integrations.yml updates
  # every dependency there to the newest release within its range each week and runs the tests, so version update
  # pull requests would duplicate that.
