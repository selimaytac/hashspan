name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you open this issue
      options:
        - label: I searched the [existing issues, open and closed](https://github.com/selimaytac/hashspan/issues?q=is%3Aissue) and this bug is not reported yet.
          required: true
        - label: I can reproduce it with the latest release of the hashspan packages.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code snippet or repository. Never include private keys or API keys.
    validations: { required: true }
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "@hashspan/viem 0.1.0, viem 2.56.9, @opentelemetry/sdk-node 0.222.0, Node 24"
    validations: { required: true }
  - type: input
    id: chain
    attributes:
      label: Chain / network
      placeholder: "Base Sepolia (84532)"
