# gitleaks (the CI secret scan) with its default rules and one allowance. Its generic-api-key rule reads the JSON key
# "token" of the facilitator corpus as a credential, but the value there is a contract address. The corpus,
# scripts/facilitators/corpus.json, is generated by corpus.mjs and pinned to it by
# packages/core/test/facilitators-corpus.test.ts.
[extend]
useDefault = true

[[allowlists]]
description = "Contract addresses under the JSON key token of the generated facilitator corpus"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''(^|/)scripts/facilitators/corpus\.json$''']
regexes = ['''^0x[0-9a-fA-F]{40}$''']
